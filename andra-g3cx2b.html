<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="Treino CDE">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/apple-touch-icon.png">
<title>Seu treino com o Lucas · Andra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#111114;--card2:#18181c;--line:#2a2a30;--txt:#f4f4f5;--mut:#9a9aa3;--red:#C8102E;--red2:#8f0b21;--silver:#c9c9cf;--ok:#2fb36b;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 60px}
header.top{text-align:center;padding:22px 0 8px}
header.top img{width:150px;max-width:60%;height:auto;display:block;margin:0 auto}
.who{margin:6px 0 0;color:var(--silver);font-size:13px}
.who b{color:#fff;font-weight:600}
.notice{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--mut);margin:12px 0}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding:8px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;min-width:64px;background:var(--card);color:var(--silver);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer}
nav.tabs button small{display:block;font-weight:400;font-size:10.5px;color:var(--mut)}
nav.tabs button[aria-selected=true]{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-color:var(--red)}
nav.tabs button[aria-selected=true] small{color:#ffd9df}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.dayhead{margin:18px 0 6px}
.dayhead h1{font-size:22px;margin:0;font-weight:700}
.dayhead p{margin:2px 0 0;color:var(--mut);font-size:13px}
.prog{height:6px;background:var(--card2);border-radius:99px;margin:12px 0 4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),#ff4d67);transition:width .3s}
.progt{font-size:11.5px;color:var(--mut);margin:0 0 10px}
details.box{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0}
details.box>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"+";color:var(--red);font-size:20px;line-height:1}
details.box[open]>summary::after{content:"–"}
.rows{padding:0 14px 10px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.row .n{flex:1}
.row .s{color:var(--mut);font-size:12px;white-space:nowrap}
.row .sub{display:block;color:var(--mut);font-size:11px}
.vid{background:var(--red);color:#fff;text-decoration:none;font-weight:600;font-size:12px;border-radius:7px;padding:5px 9px;white-space:nowrap}
.biset{border:2px solid var(--red);border-radius:18px;padding:12px 8px 4px;margin:22px 0 14px;position:relative;background:rgba(200,16,46,.05)}
.biset>.bitag{position:absolute;top:-11px;left:14px;background:var(--red);color:#fff;font-weight:700;font-size:11px;letter-spacing:1px;border-radius:999px;padding:3px 12px}
.biset>.bihint{font-size:11.5px;color:var(--mut);margin:2px 6px 0}
.biset>.card{margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.card.done{border-color:#1f6b45}
.top2{display:flex;gap:12px;padding:12px}
.thumb{position:relative;flex:0 0 108px;height:82px;border-radius:9px;overflow:hidden;background:#222;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.75);color:#fff;font-size:10.5px;padding:2px 6px;border-radius:5px}
.info{flex:1;min-width:0}
.info h3{margin:0 0 3px;font-size:14.5px;line-height:1.25;font-weight:600}
.spec{font-size:12.5px;color:var(--silver)}
.spec b{color:#fff}
.metodo{display:inline-block;margin-top:7px;background:var(--red);color:#fff;font-weight:600;font-size:11.5px;border-radius:6px;padding:3px 8px;text-decoration:none}
.nota{padding:0 12px 10px;font-size:12px;color:var(--mut)}
.reg{width:100%;background:var(--card2);color:var(--silver);border:0;border-top:1px solid var(--line);padding:10px;font-weight:600;font-size:12.5px;font-family:inherit;cursor:pointer;display:flex;justify-content:space-between}
.reg em{font-style:normal;color:var(--mut);font-weight:400}
.sets{display:none;padding:6px 12px 12px;background:var(--card2)}
.card.open .sets{display:block}
.set{display:grid;grid-template-columns:52px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:6px}
.set label{font-size:12px;color:var(--mut)}
.set input[type=number]{width:100%;background:#0a0a0c;color:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 8px;font-weight:500;font-size:14px;font-family:inherit;text-align:center;min-width:0}
.set .ck{width:44px;height:40px;border-radius:8px;border:1px solid var(--line);background:#0a0a0c;color:transparent;font-size:18px;cursor:pointer;padding:0}
.set .ck[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.loadrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--card2);border-top:1px solid var(--line)}
.loadrow label{font-size:12.5px;font-weight:600;color:var(--silver)}
.loadrow input{width:96px;background:#0a0a0c;color:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 8px;font-weight:600;font-size:15px;font-family:inherit;text-align:center}
.hdr{display:grid;grid-template-columns:52px 1fr 1fr 44px;gap:8px;font-size:10.5px;color:var(--mut);text-align:center}
.cardio{background:#0b0b0d;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0 8px}
.cardio small,.obs small{display:block;color:var(--mut);font-size:11px;margin-bottom:3px}
.cardio p{margin:0;font-weight:600;font-size:13.5px}
.obs{border-left:3px solid var(--silver);padding:4px 0 4px 12px;margin:12px 0;font-size:13.5px;color:var(--silver)}
.sec{font-size:16px;font-weight:700;margin:22px 0 6px}
.tace .row{border-top:1px solid var(--line)}
.tace .row .s{color:var(--mut)}
.small{font-size:12px;color:var(--mut)}
.reset{margin-top:18px;background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:8px 12px;font-weight:500;font-size:12px;font-family:inherit;cursor:pointer}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:26px}

.pills{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.pill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.pill small{display:block;color:var(--mut);font-size:10.5px}
.pill b{font-size:13.5px;font-weight:600}
.lead{color:var(--silver);font-size:13.5px;margin:6px 0 0}
.fin{flex:0 0 auto;align-self:center;width:52px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--mut);font-family:inherit;font-size:10.5px;font-weight:600;cursor:pointer;padding:0}
.fin i{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);font-style:normal;font-size:19px;color:transparent;background:#0a0a0c;transition:background .15s,border-color .15s}
.fin:hover i{border-color:var(--silver)}
.card.done{border-color:#1f6b45;background:#0d1a13}
.card.done .fin{color:var(--ok)}
.card.done .fin i{background:var(--ok);border-color:var(--ok);color:#fff}
.card.done .thumb,.card.done .spec,.card.done .metodo,.card.done .nota,.card.done .loadrow{display:none}
.card.done .top2{padding:10px 12px;align-items:center}
.card.done .info h3{margin:0;font-weight:500;color:var(--mut);text-decoration:line-through;text-decoration-color:#3c5;}
.done-msg{display:none;background:#0d1a13;border:1px solid #1f6b45;border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:600;font-size:13.5px;color:#9fe3bd}
.done-msg.on{display:block}
.set{grid-template-columns:52px 1fr 1fr!important}
.hdr{grid-template-columns:52px 1fr 1fr!important}
.remind{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:10px 0;font-size:12.5px;color:var(--silver)}
.remind b{color:#fff;font-weight:600}
@media (max-width:370px){.thumb{flex-basis:88px;height:70px}}
.bigs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 14px}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border:2px solid transparent;border-radius:12px;padding:12px 6px;min-height:70px;font-family:inherit;font-weight:600;font-size:12px;line-height:1.2;cursor:pointer}
.big svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.big[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
details.obsbox{margin:12px 0 0}
.endbtn{display:block;width:100%;margin:14px 0 4px;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border:0;border-radius:12px;padding:14px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
.closedbox{background:#0d1a13;border:1px solid #1f6b45;border-radius:12px;padding:12px 14px;margin:14px 0 4px;color:#9fe3bd;font-size:13.5px}
.closedbox b{color:#fff}
.closedbox ul{margin:8px 0 10px;padding-left:18px;color:var(--silver)}
.closedbox button{background:none;border:1px solid #1f6b45;color:#9fe3bd;border-radius:8px;padding:7px 12px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer}
.card.shut input,.card.shut .fin{opacity:.55;pointer-events:none}

.big.wide{grid-column:1/-1;flex-direction:row;gap:10px;min-height:54px;font-size:13px}
.dsw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.dsw button{background:var(--card);color:var(--silver);border:1px solid var(--line);border-radius:10px;padding:10px 8px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;line-height:1.25}
.dsw button small{display:block;font-weight:400;font-size:10.5px;color:var(--mut)}
.dsw button[aria-pressed=true]{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-color:var(--red)}
.dsw button[aria-pressed=true] small{color:#ffd9df}
.meal{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;padding:12px 12px 4px}
.mh{display:flex;align-items:baseline;gap:10px}
.mh b{font-size:18px;font-weight:700;color:var(--red)}
.mh span{font-size:15px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:11.5px;color:var(--silver)}
.chip b{color:#fff;font-weight:600}
.mrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.mrow span:last-child{color:var(--silver);text-align:right}
.mobs{font-size:12.5px;color:var(--mut);margin:8px 0 6px}
.meal details.box{margin:8px 0}
.meal details.box>summary{font-size:12.5px;padding:10px 12px}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>

const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : (mem[k]||null); }catch(e){ return mem[k]||null; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const slugKey = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
// A chave inclui aluno + ciclo: cada novo ciclo (ex.: "Ciclo 2 · Novembro/2026") começa com cargas limpas.
const KEY = 'cde:treino:v2:'+slugKey(D.aluno)+':'+slugKey(D.ciclo);

let view = 0;
const N = D.dias.length;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save = () => store.set(KEY,state);
function dayState(d){ state[d]=state[d]||{done:{}}; state[d].load=state[d].load||{}; return state[d]; }
function getLoad(d,e){ return dayState(d).load[e]||''; }
function putLoad(d,e,v){ dayState(d).load[e]=v; save(); }
function isDone(d,e){ return !!dayState(d).done[e]; }
function doneCount(d){ let n=0; D.dias[d].exs.forEach((x,e)=>{ if(isDone(d,e)) n++; }); return n; }

    h += m.itens.map(i=>'<div class="mrow"><span>'+esc(i[0])+'</span><span>'+esc(i[1])+'</span></div>').join('');
    if(m.obs) h += '<p class="mobs">'+esc(m.obs)+'</p>';
    (m.subs||[]).forEach(s=>{ h += '<details class="box"><summary>'+esc(s[0])+'</summary><div class="rows">'+s[1].map(r=>'<div class="row"><div class="n">'+esc(r[0])+'</div><div class="s">'+esc(r[1])+'</div></div>').join('')+'</div></details>'; });
    h += '</div>';
  });
  h += '<div class="sec">Orientações</div>' + X.orient.map(o=>'<details class="box"><summary>'+esc(o[0])+'</summary><div class="rows"><p class="small" style="color:var(--silver);font-size:13px;margin:8px 0">'+esc(o[1])+'</p></div></details>').join('');
  h += '<p class="small" style="margin-top:12px">Quantidades arredondadas para facilitar a medida em casa. O PDF da sua dieta chega separado.</p>';
  return h;
}
function renderDay(d){
  const day = D.dias[d];
  let h = '<div class="dayhead"><h1>'+esc(day.titulo)+' · '+esc(day.sub)+'</h1><p>'+esc(day.foco)+'</p></div>';
  h += '<div class="prog"><i id="pbar"></i></div><p class="progt" id="ptxt"></p>';
  h += '<div class="remind"><b>Antes:</b> '+(day.tipo==='inf'?'alongamento e mobilidade de pernas':'alongamento e mobilidade de superior')+' (botão Alongamentos e mobilidade).</div>';
  const isBi = x => x && x.metodo && /Bi-Set/.test(x.metodo);
  const parBi = (a,b) => isBi(a) && isBi(b) && (a.metodo.indexOf(b.nome)>=0 || b.metodo.indexOf(a.nome)>=0);
  day.exs.forEach((x,e)=>{
    const ini = parBi(x, day.exs[e+1]);
    if(ini && !(e>0 && parBi(day.exs[e-1], x))) h += '<div class="biset"><span class="bitag">BI-SET</span><p class="bihint">Faça os dois exercícios em sequência, sem descansar entre eles. Descanse só depois dos dois.</p>';
    h += '<div class="card" id="c'+d+'_'+e+'"><div class="top2"><a class="thumb" href="'+x.vid+'" target="_blank" rel="noopener" aria-label="Abrir vídeo: '+esc(x.nome)+'"><img src="'+x.img+'" alt="" loading="lazy"><span>▸ vídeo</span></a>'+
     '<div class="info"><h3>'+esc(x.nome)+'</h3><div class="spec"><b>'+x.series+' séries</b> · '+x.reps+(/[a-zA-Z]/.test(String(x.reps))?'':' reps')+'<br>Descanso: <b>'+x.desc+'s</b></div>'+
     (x.metodo ? (x.mlink ? '<a class="metodo" href="'+x.mlink+'" target="_blank" rel="noopener">Método '+esc(x.metodo)+' ▸ clique aqui</a>' : '<span class="metodo">Método '+esc(x.metodo)+'</span>') : '')+
     '</div><button class="fin" data-e="'+e+'" aria-pressed="false" aria-label="Concluir exercício: '+esc(x.nome)+'"><i>✓</i><span>Concluir</span></button></div>'+
     (x.nota?'<div class="nota">'+esc(x.nota)+'</div>':'')+
     '<div class="loadrow"><label for="L'+d+'_'+e+'">Maior carga hoje (kg)</label>'+
     '<input id="L'+d+'_'+e+'" type="number" inputmode="decimal" min="0" step="0.5" placeholder="kg" value="'+esc(getLoad(d,e))+'" data-e="'+e+'"></div>'+
     '</div>';
    if(e>0 && parBi(day.exs[e-1], x)) h += '</div>';
  });
  if(day.abd) h += '<div class="remind"><b>Abdômen hoje:</b> até 10 minutos — a sequência completa está no botão Vácuo e abdominais.</div>';
  h += '<div class="done-msg" id="dmsg">Treino concluído. Agora o cardio e pronto. 💪</div>';
  const cl = dayState(d).last || dayState(d).closed;
  if(cl) h += '<div class="closedbox"><b>Último treino encerrado em '+esc(cl)+'.</b> Suas cargas continuam registradas nos exercícios.</div>';
  h += '<button class="endbtn" id="endb">Encerrar treino</button>';
  h += '<div class="cardio"><small>Cardio pós-treino</small><p>'+esc(day.cardio)+'</p></div>';
  h += '<div class="obs"><small>Observação geral deste treino</small>'+esc(day.obs)+'</div>';
  h += '<button class="reset" id="reset">Limpar cargas e marcações deste dia</button>';
  return h;
}
function renderFinal(){
  let h = '<div class="dayhead"><h1>Exercícios substitutos</h1><p>E orientações finais</p></div>';
  h += '<p class="small">Aparelho ocupado ou indisponível? Cada alternativa mantém o mesmo padrão de movimento.</p>'+
   D.subs.map(s=>'<details class="box"><summary>'+esc(s[0])+'</summary><div class="rows"><div class="row" style="font-size:13px;color:var(--silver)">'+esc(s[1])+'</div></div></details>').join('');
  h += '<div class="sec">Orientações finais</div><div class="obs" style="margin-top:6px">Sua próxima reavaliação está prevista para <b>'+esc(D.reav)+'</b>. Quero que você envie suas fotos de progresso e responda o questionário de acompanhamento quando eu pedir.<br><br>Registre a maior carga que você usou em cada exercício. Se quiser, me manda um print — assim eu acompanho sua evolução.<br><br>Sentiu dor, desconforto ou algo não fez sentido pra você? Me chama antes da próxima reavaliação.</div>';
  return h;
}
function updateProg(d){
  const t=D.dias[d].exs.length, n=doneCount(d);
  document.getElementById('pbar').style.width=(t? n/t*100 : 0)+'%';
  document.getElementById('ptxt').textContent=n+' de '+t+' exercícios concluídos';
  document.getElementById('dmsg').classList.toggle('on', n===t);
  D.dias[d].exs.forEach((x,e)=>{
    const c=document.getElementById('c'+d+'_'+e), on=isDone(d,e);
    c.classList.toggle('done',on);
    const b=c.querySelector('.fin'); b.setAttribute('aria-pressed',on);
    b.querySelector('span').textContent = on ? 'Feito' : 'Concluir';
    b.setAttribute('aria-label',(on?'Reabrir exercício: ':'Concluir exercício: ')+x.nome);
  });
}
function renderMain(){
  const m=document.getElementById('main');
  if(view==='met'){ m.innerHTML=renderMetodo(); return; }
  if(view==='along'){ m.innerHTML=renderAlong(); return; }
  if(view==='abd'){ m.innerHTML=renderAbd(); return; }
  if(view==='sub'){ m.innerHTML=renderFinal(); return; }
  if(view==='dieta'){ m.innerHTML=renderDieta(); m.querySelectorAll('.dsw button').forEach(b=>b.onclick=()=>{ dtipo=+b.dataset.t; renderMain(); }); return; }
  const d=view;
  m.innerHTML=renderDay(d); updateProg(d);
  m.querySelectorAll('input[data-e]').forEach(i=>i.oninput=()=>putLoad(d,+i.dataset.e,i.value));
  m.querySelectorAll('button.fin').forEach(b=>b.onclick=()=>{
    const e=+b.dataset.e, ds=dayState(d), on=!ds.done[e];
    if(on) ds.done[e]=true; else delete ds.done[e];
    save();
        updateProg(d);
  });
  const eb=document.getElementById('endb');
  if(eb) eb.onclick=()=>{
    const falta=D.dias[d].exs.length-doneCount(d);
    if(falta>0 && !confirm('Ainda faltam '+falta+' exercício(s) sem marcar como concluído. Encerrar o treino mesmo assim? As cargas ficam registradas e as marcações verdes são limpas.')) return;
    const t=new Date(); const ds=dayState(d); ds.last=('0'+t.getDate()).slice(-2)+'/'+('0'+(t.getMonth()+1)).slice(-2); delete ds.closed; ds.done={};
    save(); renderMain(); window.scrollTo({top:0});
  };
  document.getElementById('reset').onclick=()=>{ if(confirm('Apagar as cargas e marcações de '+D.dias[d].titulo+'?')){ delete state[d]; save(); renderMain(); } };
}
document.getElementById('obs').innerHTML = renderObs();
renderTabs(); renderMain();
</script>
</body>
